<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gen Artz</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%237c6cff'/%3E%3Cstop offset='1' stop-color='%23ff5fa2'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='url(%23g)'/%3E%3Ctext x='32' y='42' font-family='Segoe UI,Arial' font-weight='800' font-size='26' fill='white' text-anchor='middle'%3EGA%3C/text%3E%3C/svg%3E">
<style>
:root{
  --bg:#f6f7fb;--surface:#fff;--surface-2:#f1f2f7;--border:#e4e6ef;--text:#151826;--muted:#5f6579;--faint:#9399ad;
  --accent:#6d5ef8;--accent-2:#ecebff;--accent-text:#4b3fd6;
  --ok:#15803d;--ok-bg:#e5f6ea;--warn:#b45309;--warn-bg:#fdf1de;--bad:#dc2626;--bad-bg:#fdecec;
  --shadow:0 1px 2px rgba(16,24,40,.05),0 1px 3px rgba(16,24,40,.05);--shadow-lg:0 16px 40px rgba(16,24,40,.16);--r:14px;
}
[data-theme=dark]{
  --bg:#0d0f15;--surface:#151821;--surface-2:#1c202c;--border:#262b3a;--text:#e8eaf2;--muted:#a0a6bc;--faint:#6c7289;
  --accent:#8b7fff;--accent-2:#262247;--accent-text:#bcb4ff;
  --ok:#4ade80;--ok-bg:#11291b;--warn:#fbbf24;--warn-bg:#30250d;--bad:#f87171;--bad-bg:#371616;
  --shadow:none;--shadow-lg:0 18px 48px rgba(0,0,0,.55);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:"Segoe UI Variable Text","Segoe UI",Inter,system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent-text)}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.app{display:grid;grid-template-columns:236px 1fr;height:100vh}
.side{background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:16px 12px;gap:3px;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 18px;font-weight:750;font-size:17px;letter-spacing:-.01em}
.logo{width:32px;height:32px;border-radius:10px;background:linear-gradient(135deg,#7c6cff,#ff5fa2);display:grid;place-items:center;color:#fff;font-weight:800;font-size:12.5px;box-shadow:0 4px 12px rgba(124,108,255,.35)}
.brand small{display:block;font-size:11px;color:var(--faint);font-weight:500}
.nav{display:flex;align-items:center;gap:11px;padding:8px 10px;border-radius:9px;color:var(--muted);cursor:pointer;border:0;background:none;width:100%;text-align:left;font-weight:550}
.nav:hover{background:var(--surface-2);color:var(--text)}
.nav.on{background:var(--accent-2);color:var(--accent-text)}
.nav .cnt{margin-left:auto;font-size:11px;background:var(--surface-2);padding:0 7px;border-radius:99px;color:var(--muted);line-height:18px}
.nav.on .cnt{background:var(--surface)}
.side .grow{flex:1;min-height:12px}
.conn{font-size:12px;color:var(--muted);padding:10px;border:1px solid var(--border);border-radius:10px;display:flex;gap:8px;align-items:center;cursor:pointer;background:none;text-align:left;width:100%}
.conn:hover{background:var(--surface-2)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--faint);flex:none}.dot.ok{background:var(--ok)}.dot.warn{background:var(--warn)}
main{display:flex;flex-direction:column;min-width:0;overflow:hidden}
.top{display:flex;align-items:center;gap:10px;padding:13px 28px;border-bottom:1px solid var(--border);background:var(--surface)}
.top h1{font-size:18px;margin:0;font-weight:680;letter-spacing:-.01em}
.searchbtn{margin-left:auto;display:flex;align-items:center;gap:8px;min-width:280px;padding:7px 10px;border:1px solid var(--border);border-radius:10px;background:var(--surface-2);color:var(--faint);cursor:pointer}
.searchbtn kbd{margin-left:auto}
kbd{font-family:inherit;font-size:11px;border:1px solid var(--border);border-radius:5px;padding:0 5px;background:var(--surface);color:var(--muted)}
#view{flex:1;overflow:auto;padding:24px 28px 56px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:9px;border:1px solid var(--border);background:var(--surface);cursor:pointer;font-weight:580;white-space:nowrap;text-decoration:none;color:var(--text)}
.btn:hover{background:var(--surface-2)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.pri:hover{filter:brightness(1.08)}
.btn.ghost{border-color:transparent;background:none}
.btn.ghost:hover{background:var(--surface-2)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:4px 9px;font-size:12.5px;border-radius:7px}
.btn.sm svg.i{width:15px;height:15px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.ib{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:8px;border:0;background:none;color:var(--muted);cursor:pointer;flex:none}
.ib:hover{background:var(--surface-2);color:var(--text)}
.ib.sm{width:26px;height:26px}.ib.sm svg.i{width:15px;height:15px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow);min-width:0}
.pad{padding:18px}
.card h3{margin:0 0 14px;font-size:14px;font-weight:680;display:flex;align-items:center;gap:8px}
.card h3 .r{margin-left:auto}
.card h3 svg.i{color:var(--accent-text)}
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g21{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
.mt{margin-top:16px}.mt8{margin-top:8px}.mt12{margin-top:12px}
.row{display:flex;align-items:center;gap:8px}.wrap{flex-wrap:wrap}.between{justify-content:space-between}.flex1{flex:1;min-width:0}
.muted{color:var(--muted)}.faint{color:var(--faint)}.sm{font-size:12.5px}.xs{font-size:11.5px}.b{font-weight:650}
.clamp2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ellip{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hero{margin-bottom:18px;gap:16px}
.hero .h2{font-size:22px;font-weight:720;letter-spacing:-.02em}
.stat{padding:16px 18px}
.stat .lbl{color:var(--muted);font-size:12.5px;font-weight:600;display:flex;align-items:center;gap:8px}
.stat .lbl span{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:var(--accent-2);color:var(--accent-text)}
.stat .val{font-size:28px;font-weight:740;letter-spacing:-.02em;margin-top:8px;line-height:1.1}
.stat .sub{font-size:12px;color:var(--faint);margin-top:2px}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:650;padding:2px 8px;border-radius:99px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)}.pill.warn{background:var(--warn-bg);color:var(--warn)}.pill.bad{background:var(--bad-bg);color:var(--bad)}.pill.acc{background:var(--accent-2);color:var(--accent-text)}
.pdot{width:8px;height:8px;border-radius:50%;background:var(--c);flex:none;display:inline-block}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld>label{font-size:12px;font-weight:650;color:var(--muted)}
.fld .hint{font-size:11.5px;color:var(--faint)}
input,select,textarea{background:var(--surface);border:1px solid var(--border);border-radius:9px;padding:8px 10px;outline:none;width:100%;min-width:0}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-2)}
input[type=checkbox]{width:16px;height:16px;accent-color:var(--accent);box-shadow:none}
textarea{resize:vertical;min-height:70px;line-height:1.5}
.chk{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:550;padding-top:22px;cursor:pointer}
.li{display:flex;align-items:center;gap:12px;padding:10px;border-radius:10px;cursor:pointer}
.li:hover{background:var(--surface-2)}
.datebox{width:44px;height:46px;border-radius:10px;background:var(--surface-2);display:flex;flex-direction:column;align-items:center;justify-content:center;flex:none;line-height:1.1}
.datebox b{font-size:16px}.datebox span{font-size:10.5px;color:var(--muted);text-transform:uppercase;font-weight:650}
.empty{text-align:center;padding:28px 16px;color:var(--muted)}
.empty svg.i{width:28px;height:28px;color:var(--faint);margin-bottom:6px}
.bar{height:7px;background:var(--surface-2);border-radius:99px;overflow:hidden;flex:1}
.bar i{display:block;height:100%;background:var(--c,var(--accent));border-radius:99px;transition:width .3s}
.seg{display:inline-flex;background:var(--surface-2);border-radius:9px;padding:3px;gap:2px}
.seg button{border:0;background:none;padding:5px 11px;border-radius:7px;cursor:pointer;color:var(--muted);font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}
[data-theme=dark] .seg button.on{background:var(--border)}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.toolbar input,.toolbar select{width:auto}
.toolbar .q{min-width:240px;flex:1;max-width:360px}
/* board */
.board{display:grid;grid-template-columns:repeat(5,minmax(230px,1fr));gap:12px;overflow-x:auto;padding-bottom:8px}
.col{background:var(--surface-2);border-radius:14px;padding:10px;min-height:340px;transition:outline .1s}
.col.over{outline:2px dashed var(--accent);outline-offset:-2px}
.col h4{margin:2px 4px 10px;font-size:12.5px;display:flex;align-items:center;gap:7px;font-weight:700}
.col h4 .n{color:var(--faint);font-weight:600}
.icard{background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:11px 12px;margin-bottom:8px;cursor:pointer;transition:border-color .15s,transform .15s}
.icard:hover{border-color:var(--accent)}
.icard .t{font-weight:650;margin:5px 0 3px}
.tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:7px}
.tag{font-size:11px;color:var(--accent-text);background:var(--accent-2);padding:1px 7px;border-radius:99px}
table.tbl{width:100%;border-collapse:collapse}
.tbl th{text-align:left;font-size:12px;color:var(--muted);font-weight:650;padding:10px 12px;border-bottom:1px solid var(--border)}
.tbl td{padding:11px 12px;border-bottom:1px solid var(--border);vertical-align:middle}
.tbl tr.click{cursor:pointer}.tbl tr.click:hover td{background:var(--surface-2)}
/* hooks */
.sug{display:flex;gap:10px;align-items:center;padding:9px 10px;border:1px solid var(--border);border-radius:10px;margin-bottom:7px}
.score{font-size:11.5px;font-weight:750;min-width:36px;text-align:center;padding:2px 6px;border-radius:7px}
.s-hi{background:var(--ok-bg);color:var(--ok)}.s-mid{background:var(--warn-bg);color:var(--warn)}.s-lo{background:var(--bad-bg);color:var(--bad)}
.hk{padding:12px 4px;border-bottom:1px solid var(--border);display:flex;gap:12px;align-items:flex-start}
.hk:last-child{border-bottom:0}
.hk .txt{font-weight:560;font-size:14.5px}
.stars{display:inline-flex;gap:1px}
.stars button{border:0;background:none;padding:1px;cursor:pointer;color:var(--border)}
.stars button.on{color:#f5b301}
.stars svg.i{width:15px;height:15px}
.stars button.on svg.i{fill:currentColor}
.tips{margin:8px 0 0;padding:0;list-style:none;font-size:12.5px;color:var(--muted)}
.tips li{display:flex;gap:6px;align-items:center;margin-top:3px}
.tips svg.i{width:14px;height:14px}
/* calendar */
.calhead{display:flex;align-items:center;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.calhead h2{margin:0 6px;font-size:18px;font-weight:700;min-width:170px}
.calwrap{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px}
.calgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-radius:var(--r);overflow:hidden;border:1px solid var(--border);background:var(--surface)}
.dow{padding:8px 10px;font-size:11.5px;font-weight:700;color:var(--muted);background:var(--surface-2);border-bottom:1px solid var(--border)}
.day{min-height:112px;padding:6px;border-right:1px solid var(--border);border-bottom:1px solid var(--border);cursor:pointer;min-width:0}
.day:nth-child(7n){border-right:0}
.day:hover{background:var(--surface-2)}
.day.out{background:var(--bg)}.day.out .dn{color:var(--faint)}
.day.over{background:var(--accent-2)}
.dn{font-size:12px;font-weight:650;width:24px;height:24px;display:grid;place-items:center;border-radius:50%}
.day.today .dn{background:var(--accent);color:#fff}
.chip{display:block;font-size:11.5px;padding:3px 6px;border-radius:6px;margin-top:3px;background:color-mix(in srgb,var(--c) 15%,transparent);border-left:3px solid var(--c);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:grab;font-weight:560}
.chip.done{opacity:.55;text-decoration:line-through}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-left:auto}
.legend span{display:inline-flex;gap:5px;align-items:center}
/* studio */
.studio{display:grid;grid-template-columns:300px minmax(0,1fr);gap:16px;align-items:start}
.tabs{display:flex;gap:3px;padding:4px;background:var(--surface-2);border-radius:11px;flex-wrap:wrap;margin-bottom:16px}
.tab{border:0;background:none;padding:7px 12px;border-radius:8px;cursor:pointer;color:var(--muted);font-weight:620;display:inline-flex;gap:7px;align-items:center}
.tab .n{font-size:11px;color:var(--faint)}
.tab.on{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}
[data-theme=dark] .tab.on{background:var(--border)}
.mlist{max-height:calc(100vh - 290px);overflow:auto;margin:10px -6px 0;padding:0 6px}
.mgrp{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--faint);margin:12px 4px 4px}
.mitem{padding:8px 10px;border-radius:9px;cursor:pointer;border:1px solid transparent}
.mitem:hover{background:var(--surface-2)}
.mitem.on{background:var(--accent-2);border-color:color-mix(in srgb,var(--accent) 35%,transparent)}
.mitem .n{font-weight:640;display:flex;gap:6px;align-items:center}
.mitem .d{font-size:12px;color:var(--muted)}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:12px}
pre.code{background:var(--surface-2);border-radius:10px;padding:12px;font:12px/1.55 ui-monospace,"Cascadia Code",Consolas,monospace;overflow:auto;max-height:240px;margin:0;white-space:pre-wrap;word-break:break-word}
details summary{cursor:pointer;font-weight:620;font-size:13px;color:var(--muted);padding:4px 0}
.note{font-size:12.5px;padding:10px 12px;border-radius:10px;background:var(--surface-2);color:var(--muted);display:flex;gap:9px;align-items:flex-start}
.note svg.i{width:16px;height:16px;margin-top:1px;color:var(--accent-text)}
.guide{border:1px solid var(--border);border-radius:11px;padding:10px 12px;background:var(--surface-2)}
.guide .b svg.i{width:15px;height:15px;vertical-align:-3px;margin-right:5px;color:var(--accent-text)}
.guide .chipbtn{font-family:ui-monospace,Consolas,monospace;font-size:12px}
.note.warn{background:var(--warn-bg);color:var(--warn)}.note.warn svg.i{color:var(--warn)}
.job{display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:12px;padding:14px 4px;border-bottom:1px solid var(--border)}
.job:last-child{border-bottom:0}
.jico{width:36px;height:36px;border-radius:10px;background:var(--accent-2);color:var(--accent-text);display:grid;place-items:center}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.thumbs img,.thumbs video{width:132px;height:88px;object-fit:cover;border-radius:9px;background:var(--surface-2);display:block}
.thumbs audio{width:260px;height:36px}
.spin{width:10px;height:10px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .8s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chipbtn{border:1px solid var(--border);background:var(--surface);border-radius:99px;padding:4px 10px;font-size:12.5px;cursor:pointer;font-weight:560}
.chipbtn:hover{border-color:var(--accent);color:var(--accent-text)}
/* library */
.lib{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.asset{overflow:hidden}
.asset .media{aspect-ratio:4/3;background:var(--surface-2);display:grid;place-items:center;overflow:hidden}
.asset .media img,.asset .media video{width:100%;height:100%;object-fit:cover;display:block}
.asset .media audio{width:90%}
.nomedia{width:100%;height:100%;min-height:80px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--faint);font-size:11.5px;background:var(--surface-2);border-radius:inherit;text-align:center;padding:6px}
.thumbs .nomedia{width:132px;height:88px;border-radius:9px}
.asset .body{padding:11px 12px}
/* progress */
.ringwrap{display:flex;align-items:center;gap:18px}
.ring text{font-family:inherit}
.bars{display:flex;align-items:flex-end;gap:10px;height:170px;padding-top:10px}
.bars .b{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end;min-width:0}
.bars .b i{width:100%;max-width:42px;background:var(--accent);border-radius:7px 7px 3px 3px;min-height:3px;display:block}
.bars .b i.cur{background:linear-gradient(180deg,#a99dff,var(--accent))}
.bars .b span{font-size:11px;color:var(--faint);white-space:nowrap}
.bars .b em{font-size:11.5px;font-style:normal;font-weight:700;color:var(--muted)}
.heat{display:grid;grid-template-rows:repeat(7,13px);grid-auto-flow:column;grid-auto-columns:13px;gap:3px}
.heat i{border-radius:3px;background:var(--surface-2)}
.heat i.h1{background:color-mix(in srgb,var(--accent) 35%,var(--surface-2))}.heat i.h2{background:color-mix(in srgb,var(--accent) 65%,var(--surface-2))}.heat i.h3{background:var(--accent)}
.hrow{display:flex;align-items:center;gap:10px;margin-bottom:10px;font-size:13px}
.hrow .l{width:96px;color:var(--muted);font-weight:560}
.hrow .v{width:28px;text-align:right;font-weight:700}
/* settings */
.set{display:grid;grid-template-columns:220px minmax(0,1fr);gap:24px;padding:18px 0;border-bottom:1px solid var(--border)}
.set:last-child{border-bottom:0}
.set h4{margin:0 0 4px;font-size:14px}
.set p{margin:0;font-size:12.5px;color:var(--muted)}
/* overlays */
.ov{position:fixed;inset:0;background:rgba(10,12,20,.45);display:grid;place-items:center;z-index:50;padding:20px;backdrop-filter:blur(3px);animation:fd .15s}
.mbox{width:min(600px,100%);max-height:90vh;display:flex;flex-direction:column;background:var(--surface);border-radius:16px;box-shadow:var(--shadow-lg);border:1px solid var(--border);animation:pop .16s}
.mh{display:flex;align-items:center;padding:16px 18px;border-bottom:1px solid var(--border)}
.mh h2{font-size:16px;margin:0;font-weight:700}
.mh .ib{margin-left:auto}
.mb{padding:18px;display:grid;gap:14px;overflow:auto}
.mf{display:flex;gap:8px;padding:14px 18px;border-top:1px solid var(--border);justify-content:flex-end;flex-wrap:wrap}
.pal{position:fixed;inset:0;background:rgba(10,12,20,.45);z-index:60;display:flex;justify-content:center;padding-top:11vh;backdrop-filter:blur(3px)}
.pbox{width:min(640px,94vw);background:var(--surface);border-radius:16px;box-shadow:var(--shadow-lg);border:1px solid var(--border);overflow:hidden;align-self:flex-start;animation:pop .14s}
.pin{display:flex;align-items:center;gap:10px;padding:4px 16px;border-bottom:1px solid var(--border);color:var(--faint)}
.pin input{border:0;padding:14px 0;font-size:15.5px;box-shadow:none!important;background:none}
.pres{max-height:52vh;overflow:auto;padding:6px}
.pgrp{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--faint);padding:10px 12px 4px}
.pit{display:flex;gap:10px;align-items:center;padding:8px 12px;border-radius:9px;cursor:pointer}
.pit .s{margin-left:auto;font-size:12px;color:var(--faint);white-space:nowrap}
.pit.on{background:var(--accent-2)}
.pit svg.i{color:var(--muted);width:16px;height:16px}
#toasts{position:fixed;bottom:20px;right:20px;display:grid;gap:8px;z-index:70}
.toast{background:var(--text);color:var(--bg);padding:10px 14px;border-radius:11px;box-shadow:var(--shadow-lg);font-weight:580;max-width:380px;animation:pop .18s;font-size:13.5px}
.toast.bad{background:var(--bad);color:#fff}
@keyframes pop{from{opacity:0;transform:translateY(6px) scale(.98)}}
@keyframes fd{from{opacity:0}}
@media(max-width:1180px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3,.g21,.calwrap{grid-template-columns:1fr}.studio{grid-template-columns:1fr}.mlist{max-height:300px}}
@media(max-width:760px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;bottom:0;left:0;right:0;flex-direction:row;padding:6px;z-index:20;border-right:0;border-top:1px solid var(--border);overflow-x:auto;gap:2px}
  .brand,.side .grow,.conn,.nav span,.nav .cnt{display:none}
  .nav{justify-content:center;padding:10px;width:auto;flex:1}
  #view{padding:16px 14px 96px}.top{padding:11px 14px}.searchbtn{min-width:0}.searchbtn span,.searchbtn kbd{display:none}
  .g2,.g4{grid-template-columns:1fr}.set{grid-template-columns:1fr;gap:10px}
}

const DESK=!!(window.genartz&&window.genartz.isDesktop);
const TERMINAL=['completed','failed','nsfw','canceled','cancelled','draft'];
const api={
  mode(){return DESK?(UI.hasKey?'desktop':'nokey'):(S.settings.proxyUrl?'proxy':'off')},
  async submit(path,body,idem){if(DESK)return unwrap(await window.genartz.submit({path,body,idem}));return pfetch('POST',path,body,idem)},
  async status(j){if(DESK)return unwrap(await window.genartz.status(j.requestId));return pfetch('GET','requests/'+encodeURIComponent(j.requestId)+'/status')},
  async cancel(j){if(DESK)return unwrap(await window.genartz.cancel({id:j.requestId,url:j.cancelUrl}));return pfetch('POST','requests/'+encodeURIComponent(j.requestId)+'/cancel')}
};
function unwrap(r){if(!r||!r.ok)throw new Error((r&&r.error)||'Request failed');return r.data}
async function pfetch(method,path,body,idem){
  const base=S.settings.proxyUrl.replace(/\/+$/,'');
  const h={'Content-Type':'application/json'};if(idem)h['Idempotency-Key']=idem;
  const r=await fetch(base+'/'+path.replace(/^\/+/,''),{method,headers:h,body:body?JSON.stringify(body):undefined});
  const t=await r.text();let d;try{d=JSON.parse(t)}catch(e){d={raw:t}}
  if(!r.ok)throw new Error('HTTP '+r.status+': '+(d.detail||d.message||d.error||t.slice(0,160)));
  return d;
}

const closeModal=()=>{$('#modal').innerHTML=''};
async function copy(t,msg='Copied'){try{await navigator.clipboard.writeText(t)}catch(e){const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();document.execCommand('copy');a.remove()}toast(msg)}
function openExt(url){if(DESK&&window.genartz.open)window.genartz.open(url);else window.open(url,'_blank','noopener')}

const empty=(icon,t,sub='',btn='')=>`<div class="empty">${ic(icon)}<div class="b" style="color:var(--text)">${t}</div><div class="sm">${sub}</div>${btn?`<div class="mt12">${btn}</div>`:''}</div>`;
function ring(pct,big,small,size=128){const r=size/2-10,c=2*Math.PI*r,o=c*(1-Math.min(1,pct/100));return `<svg class="ring" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}"><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--surface-2)" stroke-width="11"/><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="url(#rg)" stroke-width="11" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${o}" transform="rotate(-90 ${size/2} ${size/2})"/><defs><linearGradient id="rg"><stop offset="0" stop-color="#7c6cff"/><stop offset="1" stop-color="#ff5fa2"/></linearGradient></defs><text x="50%" y="48%" text-anchor="middle" font-size="${size/6}" font-weight="750" fill="var(--text)">${big}</text><text x="50%" y="64%" text-anchor="middle" font-size="11.5" fill="var(--muted)">${small}</text></svg>`}
function streaks(){const days=new Set(S.log.map(l=>l.d));let d=new Date();if(!days.has(ymd(d)))d=addDays(d,-1);let cur=0;while(days.has(ymd(d))){cur++;d=addDays(d,-1)}
  const s=[...days].sort();let best=0,run=0,prev=null;s.forEach(x=>{run=prev&&ymd(addDays(parseYmd(prev),1))===x?run+1:1;best=Math.max(best,run);prev=x});return{cur,best}}
const postRow=(p,compact)=>{const d=parseYmd(p.date);return `<div class="li" data-a="editPost" data-id="${p.id}"><div class="datebox"><b>${d.getDate()}</b><span>${d.toLocaleDateString(undefined,{month:'short'})}</span></div><div class="flex1"><div class="b ellip">${esc(p.title)}</div><div class="row wrap xs muted" style="gap:2px 10px">${platTag(p.platform)}<span style="white-space:nowrap">${compact?fmtTime(p.time):fmtDate(p.date)+' · '+fmtTime(p.time)}</span></div></div>${compact?(p.status==='posted'?`<span style="color:var(--ok)" title="Posted">${ic('check')}</span>`:''):p.status==='posted'?'<span class="pill ok">Posted</span>':'<span class="pill acc">Scheduled</span>'}</div>`};

/* ---------- hooks scoring ---------- */
function hookScore(t){t=String(t||'').trim();const w=t?t.split(/\s+/).length:0;let s=45;const tips=[];
  if(w>=4&&w<=12)s+=18;else if(w>12&&w<=18){s+=6;tips.push('Trim to 12 words or fewer')}else if(w>18){s-=12;tips.push('Too long — cut to under 12 words')}else if(w)tips.push('Add a bit more context');
  if(/\d/.test(t))s+=8;else tips.push('Add a number (3 tips, 60 seconds…)');
  if(/\b(you|your|you're)\b/i.test(t))s+=8;else tips.push('Speak to the viewer with “you”');
  if(/\b(stop|never|secret|nobody|mistake|wrong|why|how|pov|wait|before|only|shouldn't|insane|truth|worst|best)\b/i.test(t))s+=11;else tips.push('Add tension: secret, mistake, stop, POV…');
  if(/\?$/.test(t))s+=4;if(t.length>110)s-=8;
  return{s:Math.max(0,Math.min(100,s)),w,tips}}
const scoreTag=t=>{const{s}=hookScore(t);return `<span class="score ${s>=75?'s-hi':s>=55?'s-mid':'s-lo'}" title="Hook score">${s}</span>`};
const HOOK_T=['Stop scrolling if you care about {t}.','I made this {t} with AI in under 10 minutes.','Nobody is talking about this {t} trick.','3 mistakes everyone makes with {t}.','POV: you finally figured out {t}.','This {t} shouldn’t be possible with AI.','Watch this before you try {t}.','I spent 30 days testing {t}. Here’s what happened.','You’re doing {t} wrong. Here’s why.','The {t} secret pros won’t tell you.','Wait for the ending… {t} like you’ve never seen it.','What if {t} took 60 seconds?','How I’d start {t} from zero in '+new Date().getFullYear()+'.','Is {t} worth it in '+new Date().getFullYear()+'? Honest answer.','Before vs after: {t} with one prompt.','This is your sign to try {t}.','Rate this {t} from 1 to 10.','I asked AI to make {t}. It went too far.','Steal my exact {t} workflow.','Everyone’s sleeping on {t}. Here’s why you shouldn’t.','Only 1% of creators know this about {t}.','Why does nobody show the real {t} process?'];
function genHooks(topic){const arr=[...HOOK_T].sort(()=>Math.random()-.5).slice(0,8).map(x=>x.replace('{t}',topic));return arr.sort((a,b)=>hookScore(b).s-hookScore(a).s)}
function meter(t){if(!t.trim())return `<div class="xs faint">Start typing to see a live score and tips.</div>`;const h=hookScore(t);const c=h.s>=75?'var(--ok)':h.s>=55?'var(--warn)':'var(--bad)';
  return `<div class="row"><span class="sm b" style="color:${c};min-width:74px">Score ${h.s}</span><div class="bar" style="--c:${c}"><i style="width:${h.s}%"></i></div><span class="xs faint">${h.w} words · ${t.length} chars</span></div>`+(h.tips.length?`<ul class="tips">${h.tips.slice(0,3).map(x=>`<li>${ic('info')}${x}</li>`).join('')}</ul>`:`<ul class="tips"><li style="color:var(--ok)">${ic('check')}Strong hook. Ready to save.</li></ul>`)}
function live(k){if(k==='hookDraft'){const m=$('#hk-meter');if(m)m.innerHTML=meter(UI.hookDraft)}}

  const{y,m}=UI.cal,first=new Date(y,m,1),start=weekStart(first),t=today();
  let n=42;if(addDays(start,35).getMonth()!==m)n=35;
  const cells=[];for(let i=0;i<n;i++)cells.push(addDays(start,i));
  const byDay={};S.posts.forEach(p=>(byDay[p.date]=byDay[p.date]||[]).push(p));
  const mo=`${y}-${pad(m+1)}`,monthPosts=S.posts.filter(p=>p.date.startsWith(mo)).sort(byDT);
  const ready=S.ideas.filter(i=>['Ready','Producing'].includes(i.status)&&!S.posts.some(p=>p.ideaId===i.id&&p.status!=='posted'));
  return `<div class="calhead"><button class="ib" data-a="calNav" data-v="-1" title="Previous month">${ic('chevL')}</button><h2>${first.toLocaleDateString(undefined,{month:'long',year:'numeric'})}</h2><button class="ib" data-a="calNav" data-v="1" title="Next month">${ic('chevR')}</button><button class="btn sm" data-a="calNav" data-v="0">Today</button><div class="legend">${Object.values(PLATFORMS).map(p=>`<span><span class="pdot" style="--c:${p.c}"></span>${p.n}</span>`).join('')}</div></div>
  <div class="calwrap"><div><div class="calgrid">${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(d=>`<div class="dow">${d}</div>`).join('')}
   ${cells.map(d=>{const ds=ymd(d);const ps=(byDay[ds]||[]).sort(byDT);return `<div class="day ${d.getMonth()!==m?'out':''} ${ds===t?'today':''}" data-a="dayClick" data-day="${ds}" data-drop="day"><div class="dn">${d.getDate()}</div>${ps.slice(0,3).map(p=>`<div class="chip ${p.status==='posted'?'done':''}" style="--c:${plat(p.platform).c}" draggable="true" data-drag="post" data-id="${p.id}" data-a="editPost" title="${esc(p.title)} · ${plat(p.platform).n}">${fmtTime(p.time)} ${esc(p.title)}</div>`).join('')}${ps.length>3?`<div class="xs faint" style="margin-top:3px">+${ps.length-3} more</div>`:''}</div>`}).join('')}</div>
   <div class="xs faint mt8">Click a day to schedule a post. Drag posts to move them.</div></div>
   <div class="grid" style="align-content:start">
    <div class="card pad"><h3>${ic('cal')}This month <span class="pill">${monthPosts.length}</span></h3>${monthPosts.length?monthPosts.map(p=>postRow(p,true)).join(''):empty('cal','No posts this month')}</div>
    <div class="card pad"><h3>${ic('send')}Ready to schedule</h3>${ready.length?ready.map(i=>`<div class="row" style="padding:6px 0"><div class="flex1"><div class="sm b ellip">${esc(i.title)}</div>${platTag(i.platform)}</div><button class="btn sm" data-a="ideaSchedule" data-id="${i.id}">Schedule</button></div>`).join(''):'<div class="sm faint">Ideas marked Producing or Ready show up here.</div>'}</div>
   </div></div>`;
}
function postModal(id,preset={}){
  const p=id?S.posts.find(x=>x.id===id):{title:'',ideaId:'',platform:'tiktok',date:today(),time:'18:00',status:'scheduled',hookId:'',notes:'',...preset};if(!p)return;
  const hooks=S.hooks.filter(h=>!p.ideaId||h.ideaId===p.ideaId||h.id===p.hookId);
  openModal(id?'Edit post':'Schedule a post',`
   <div class="fld"><label>Linked idea</label><select id="m-idea">${ideaOpts(p.ideaId,'None')}</select></div>
   <div class="fld"><label>Post title</label><input id="m-ptitle" value="${esc(p.title)}" placeholder="What are you posting?"></div>
   <div class="grid g3"><div class="fld"><label>Platform</label><select id="m-pplat">${platOpts(p.platform)}</select></div><div class="fld"><label>Date</label><input type="date" id="m-date" value="${p.date}"></div><div class="fld"><label>Time</label><input type="time" id="m-time" value="${p.time}"></div></div>
   <div class="grid g2"><div class="fld"><label>Hook</label><select id="m-hook"><option value="">No hook</option>${hooks.map(h=>`<option value="${h.id}" ${p.hookId===h.id?'selected':''}>${esc(h.text.slice(0,70))}</option>`).join('')}</select></div><div class="fld"><label>Status</label><select id="m-pstatus"><option value="scheduled" ${p.status!=='posted'?'selected':''}>Scheduled</option><option value="posted" ${p.status==='posted'?'selected':''}>Posted</option></select></div></div>
   <div class="fld"><label>Caption / notes</label><textarea id="m-pnotes" rows="3" placeholder="Caption, hashtags, links…">${esc(p.notes)}</textarea></div>`,
   `${id?`<button class="btn danger" data-a="delPost" data-id="${id}">${ic('trash')}Delete</button><span style="flex:1"></span>${p.status!=='posted'?`<button class="btn" data-a="markPosted" data-id="${id}">${ic('check')}Mark posted</button>`:''}`:'<button class="btn" data-a="closeModal">Cancel</button>'}<button class="btn pri" data-a="savePost" data-id="${id||''}">${ic('check')}Save</button>`);
}
function savePost(id,forcePosted){
  const title=$('#m-ptitle').value.trim(),date=$('#m-date').value;if(!title)return toast('Add a post title');if(!date)return toast('Pick a date');
  const d={title,ideaId:$('#m-idea').value,platform:$('#m-pplat').value,date,time:$('#m-time').value||'09:00',hookId:$('#m-hook').value,status:forcePosted?'posted':$('#m-pstatus').value,notes:$('#m-pnotes').value.trim()};
  let p;if(id){p=S.posts.find(x=>x.id===id);const was=p.status;if(p.date!==d.date||p.time!==d.time)p.notified=false;Object.assign(p,d);if(was!=='posted'&&d.status==='posted')posted(p)}
  else{p={id:uid(),...d};S.posts.push(p);act('sched');if(p.status==='posted')posted(p)}
  if(d.ideaId){const i=S.ideas.find(x=>x.id===d.ideaId);if(i&&p.status!=='posted'&&['Idea','Scripting','Producing'].includes(i.status)){i.status='Ready';i.updatedAt=Date.now()}}
  save();closeModal();render();toast(p.status==='posted'?'Marked as posted ✓':'Post scheduled for '+fmtDate(p.date));
}
function posted(p){act('post');const i=S.ideas.find(x=>x.id===p.ideaId);if(i){i.status='Posted';i.updatedAt=Date.now()}}

/* ---------- video prompt guides (per model family) ---------- */
const A='«',Z='»';// placeholder markers (angle brackets are Seedance's sound-effect syntax)
const L=s=>A+s+Z;
function refTags(m,f,kl){const out=[],cnt={image:0,video:0,audio:0};
  m.refs.filter(r=>!['start_image','end_image','mask','location_image'].includes(r)).forEach(r=>{
    const t=/video/.test(r)?'video':/audio/.test(r)?'audio':'image';
    String(f['ref:'+r]||'').split(/[\s,]+/).filter(u=>/^https?:\/\//.test(u)).forEach(()=>{cnt[t]++;out.push({tag:kl?`@${t}_${cnt[t]}`:`@${t}${cnt[t]}`,t,role:r})})});
  return out}
const has=(f,r)=>String(f['ref:'+r]||'').trim().length>0;
const story=c=>c.f.prompt&&c.f.prompt.trim()&&!/^\[|^Camera|^Edit|^Extend|^Continue/.test(c.f.prompt.trim())?c.f.prompt.trim().replace(/[.\s]+$/,''):L('one-sentence summary of what happens');
const pre=(c,end='. ')=>{const v=story(c);return v.startsWith('«')?end.replace(/[^\n]/g,''):v+end};
const bindLines=(tags,kl)=>tags.map((t,i)=>t.t==='image'?`${L('Character '+'ABCDEFGHIJ'[tags.filter(x=>x.t==='image').indexOf(t)]+' / product / place')} = ${t.tag}. Use only its appearance${t.role==='character_images'?'':' and clothing'}; do not use the image background.`:t.t==='video'?`${t.tag} = motion reference. Copy only its ${L('camera move / body movement')}, not the people or setting.`:`${t.tag} = audio reference for ${L('voice / music / rhythm')}.`).join('\n');
const audioBlock=c=>c.audioOn===false?'':`\n\n[AUDIO]\n(${L('music, or delete this line')})\n<${L('sound effect / ambience')}>\nDialogue language: ${L('e.g. American English / Filipino')}. ${L('Character')} says: {${L('line')}}`;
const VG={
  seedance:{fmt:'Director brief',ph:'[GOAL] … [SHOT 1 | 0–5s | camera] … [VISUAL STYLE] … [AUDIO]',
    tips:['One [SHOT] block per continuous camera shot. Start a new block only for a real cut.','Bind every reference by tag (@image1, @video1, @audio1) and say what to take from it.','Audio syntax: (music) <sound effect> {dialogue} [subtitle]. State the dialogue language first.','Describe emotions as visible cues: shallow breathing, trembling hands, eyes widen.','Keep resolution, duration and aspect ratio in the settings, not the prompt.'],
    needs:c=>c.mode==='video_edit'?[['video_references','the video to edit']]:c.mode==='video_extension'?[['video_references','the video to extend']]:[],
    warn:c=>c.mode==='video_extension'&&!c.f.extension_mode?'Pick an Extend direction (forward or backward).':'',
    tpl:c=>{const d=c.dur||5;
      if(c.mode==='video_edit')return `Edit @video1. Keep the camera motion, timing, framing and everything not mentioned unchanged.\nChange: ${L('what to replace or restyle, e.g. replace the jacket with the outfit in @image1')}.\nKeep: ${L('face/identity, background, lighting')}.${c.tags.filter(t=>t.t==='image').length?'\n\n'+bindLines(c.tags.filter(t=>t.t==='image')):''}`;
      if(c.mode==='video_extension'){const fw=c.f.extension_mode!=='backward';return `Extend @video1 ${fw?'forward':'backward'} by ${d} seconds, continuing seamlessly from its ${fw?'last':'first'} frame. Same subject, outfit, lighting and camera style.\n\n[SHOT 1 | 0–${d}s | ${L('camera continues: e.g. slow push-in')}]\nAction: ${L('what happens '+(fw?'next':'before'))}.\nEnd state: ${L('the final frame')}.`+audioBlock(c)}
      const refs=c.tags.length?`\n\n[REFERENCES]\n${bindLines(c.tags)}`:'';
      const frames=(has(c.f,'start_image')?'\nStart frame: the start frame image. ':'')+(has(c.f,'end_image')?'End on the end frame image.':'');
      return `[GOAL]\n${L('Video type')} of ${L('subject')}: ${story(c)}. ${d} seconds, one continuous shot.${refs}\n\n[SHOT 1 | 0–${d}s | ${L('shot size, angle, camera move')}]\nCamera: ${L('e.g. medium shot, eye level, slow push-in')}.${frames}\nInitial state: ${L('where the subject is and what they are doing')}.\nAction: ${L('connected actions, in order')}.\nEnd state: ${L('what is visible at the end')}.\n\n[VISUAL STYLE]\n${L('lighting, color grade, lens feel, mood')}`+audioBlock(c)+`\n\n[MAINTAIN CONSISTENCY]\nSame subject, outfit, headcount and layout throughout.`}},
  kling4:{fmt:'Subject · motion · scene · camera',kl:1,ph:'A woman in a red raincoat runs across a neon street at night, tracking shot from the side…',
    tips:['Text-to-video: subject + motion + scene + camera + lighting/style, in plain sentences.','Image-to-video: the start frame already shows the look, so describe the motion and the camera, not the appearance.','Reference-to-video: name each reference by tag (@image_1…) and say what it is. If tags are ignored, describe it in words (“the woman from the first reference”).','Video edit: one clear instruction: what to change and what to keep.','Up to 30 s. For longer stories, describe beats in order with rough timing.'],
    needs:c=>c.mode==='image-to-video'?[['start_image','a start frame']]:c.mode==='reference-to-video'?[['image_references','at least one reference image']]:c.mode==='video-edit'?[['video_references','the base video (first URL)']]:[],

      return `${refs}${pre(c,'.\n')}${L('Subject and key details')} ${L('action')} in ${L('setting')}.\nCamera: ${L('shot size, angle, movement')}.\nStyle: ${L('lighting, mood, film look')}.\nSound: ${L('ambience, effects, or a spoken line')}.`}},
  klingI2V:{fmt:'Short shot description',ph:'Slow push-in on a lone surfer at sunrise, waves rolling, golden light…',

  veo:{fmt:'Cinematic paragraph + audio',ph:'Medium shot, slow dolly-in. A barista in a cozy café … The barista says: "…" Sound: espresso hiss, soft jazz.',
    tips:['Order: shot and camera → subject → action → setting → lighting/style → audio.','Dialogue: write who speaks and put the line in quotes: The man says: "We’re late."','Describe sound separately: ambience, effects, music.','With a start frame, focus on motion and sound.','Clips are 4, 6 or 8 seconds. Keep it to one or two beats.'],
    tpl:c=>`${L('Shot size')}, ${L('camera move')}. ${has(c.f,'start_image')?'Starting from the image, ':''}${L('Subject with key details')} ${L('action')} in ${L('setting')}. ${pre(c,'.\n')}Lighting and style: ${L('e.g. warm golden hour, shallow depth of field, 35mm film')}.\n${L('Character')} says: "${L('line')}"\nSound: ${L('ambience and effects')}. Music: ${L('style, or none')}.`},
  gemini:{fmt:'Mode-based instruction',ph:'Describe the scene, or for Edit / Extend write the change or what happens next…',

function applyStatus(j,r){const prev=j.status;j.status=String(r.status||j.status).toLowerCase();j.lastCheck=Date.now();
  if(j.status==='completed'&&prev!=='completed'){j.outputs=extractUrls(r);j.outputs.forEach(u=>S.assets.unshift({id:uid(),url:u,type:mediaType(u,j.cat),title:(j.prompt||j.name).slice(0,90),model:j.name,ideaId:j.ideaId||'',jobId:j.id,createdAt:Date.now()}));act('gen');notify('Generation ready',j.name);toast(j.name+' finished ✓');if(!j.outputs.length)j.error='Finished, but no media URL was found in the response.'}

function extractUrls(o){const out=[];const skip=['status_url','cancel_url','webhook_url'];

/* ---------- VIEW: progress ---------- */
function vProg(){
  const goal=+S.settings.weeklyGoal||5,ws=weekStart(),st=streaks();
  const weeks=[];for(let i=7;i>=0;i--){const s=addDays(ws,-7*i),e=addDays(s,6);weeks.push({s,n:S.posts.filter(p=>p.status==='posted'&&p.date>=ymd(s)&&p.date<=ymd(e)).length,cur:i===0})}
  const maxW=Math.max(goal,...weeks.map(w=>w.n),1);const doneWk=weeks[7].n;
  const days=new Map();S.log.forEach(l=>days.set(l.d,(days.get(l.d)||0)+1));
  const hs=addDays(ws,-77);const heat=[];for(let i=0;i<84;i++){const d=addDays(hs,i);const v=days.get(ymd(d))||0;heat.push(`<i class="${v>=4?'h3':v>=2?'h2':v>=1?'h1':''}" title="${fmtDate(ymd(d))}: ${v} action${v===1?'':'s'}"></i>`)}
  const totalPosted=S.posts.filter(p=>p.status==='posted').length;
  const byPlat=Object.entries(PLATFORMS).map(([k,p])=>[p,S.posts.filter(x=>x.status==='posted'&&x.platform===k).length]);const mp=Math.max(1,...byPlat.map(x=>x[1]));
  const gens=S.jobs.filter(j=>j.status==='completed').length;
  return `<div class="grid g4">
   <div class="card stat"><div class="lbl"><span>${ic('flame')}</span>Current streak</div><div class="val">${st.cur} days</div><div class="sub">Best: ${st.best} days</div></div>
   <div class="card stat"><div class="lbl"><span>${ic('check')}</span>Total posted</div><div class="val">${totalPosted}</div><div class="sub">All time</div></div>
   <div class="card stat"><div class="lbl"><span>${ic('zap')}</span>Hooks written</div><div class="val">${S.hooks.length}</div><div class="sub">${S.hooks.filter(h=>hookScore(h.text).s>=75).length} scored 75+</div></div>
   <div class="card stat"><div class="lbl"><span>${ic('sparkles')}</span>Generations</div><div class="val">${gens}</div><div class="sub">${S.assets.length} items in library</div></div></div>
  <div class="grid g21 mt">
   <div class="card pad"><h3>${ic('trend')}Posts per week<span class="xs faint r">Goal line: ${goal}</span></h3><div class="bars" style="position:relative"><div style="position:absolute;left:0;right:0;bottom:${Math.round(22+goal/maxW*120)}px;border-top:1.5px dashed var(--faint);opacity:.7"></div>${weeks.map(w=>`<div class="b"><em>${w.n}</em><i class="${w.cur?'cur':''}" style="height:${Math.max(3,Math.round(w.n/maxW*120))}px"></i><span>${w.cur?'This wk':w.s.toLocaleDateString(undefined,{month:'short',day:'numeric'})}</span></div>`).join('')}</div></div>
   <div class="card pad"><h3>${ic('target')}Weekly goal</h3><div class="ringwrap">${ring(Math.round(doneWk/goal*100),doneWk+'/'+goal,'this week')}<div class="flex1"><div class="fld"><label for="goal-in">Posts per week</label><input type="number" id="goal-in" min="1" max="50" data-set="weeklyGoal" value="${goal}"></div><div class="xs faint mt8">Week starts Monday.</div></div></div></div></div>
  <div class="grid g3 mt">
   <div class="card pad"><h3>${ic('cal')}Activity (12 weeks)</h3><div class="heat">${heat.join('')}</div><div class="row xs faint mt12">Less<span class="heat" style="grid-template-rows:13px;display:inline-grid"><i></i><i class="h1"></i><i class="h2"></i><i class="h3"></i></span>More</div><div class="xs faint mt8">Counts ideas, hooks, scheduling, posting and generations.</div></div>
   <div class="card pad"><h3>${ic('board')}Idea pipeline</h3>${STAT.map(s=>{const n=S.ideas.filter(i=>i.status===s).length;return `<div class="hrow"><span class="l">${s}</span><div class="bar" style="--c:${STATC[s]}"><i style="width:${n/Math.max(1,S.ideas.length)*100}%"></i></div><span class="v">${n}</span></div>`}).join('')}</div>
   <div class="card pad"><h3>${ic('send')}Posted by platform</h3>${byPlat.map(([p,n])=>`<div class="hrow"><span class="l">${p.n}</span><div class="bar" style="--c:${p.c}"><i style="width:${n/mp*100}%"></i></div><span class="v">${n}</span></div>`).join('')}</div></div>`;
}

/* ---------- command palette ---------- */
let palSel=0,palList=[];
function openPal(){$('#palette').innerHTML=`<div class="pal" data-a="palClose"><div class="pbox"><div class="pin">${ic('search')}<input id="pal-q" placeholder="Search ideas, hooks, posts, models, pages…" autocomplete="off"><kbd>Esc</kbd></div><div class="pres" id="pal-res"></div></div></div>`;palSel=0;$('#pal-q').focus();palRender()}
const closePal=()=>{$('#palette').innerHTML=''};
function palItems(q){q=q.toLowerCase().trim();const it=[];
  Object.entries(ROUTES).forEach(([k,[n,i]])=>it.push({g:'Pages',l:n,i,run:()=>go(k)}));
  [['New idea','bulb',()=>ideaModal()],['Schedule a post','cal',()=>postModal()],['Write a hook','zap',()=>go('hooks')],['Toggle dark mode','moon',toggleTheme],['Export backup','download',exportData]].forEach(([l,i,run])=>it.push({g:'Actions',l,i,run}));
  S.ideas.forEach(x=>it.push({g:'Ideas',l:x.title,s:x.status,i:'bulb',t:x.notes+' '+x.tags.join(' '),run:()=>{go('ideas');ideaModal(x.id)}}));
  S.hooks.forEach(h=>it.push({g:'Hooks',l:h.text,s:'Score '+hookScore(h.text).s,i:'zap',run:()=>{UI.hookQ=h.text.slice(0,40);go('hooks')}}));
  S.posts.forEach(p=>it.push({g:'Posts',l:p.title,s:fmtDate(p.date)+' · '+plat(p.platform).n,i:'cal',t:p.notes,run:()=>{const d=parseYmd(p.date);UI.cal={y:d.getFullYear(),m:d.getMonth()};go('calendar');postModal(p.id)}}));
  MODELS.forEach(m=>it.push({g:'Models',l:m.name,s:m.prov+' · '+catOf(m.cat).n,i:catOf(m.cat).i,t:m.desc,run:()=>{UI.cat=m.cat;UI.model=m.id;go('studio')}}));
  S.assets.forEach(a=>it.push({g:'Library',l:a.title||'Untitled',s:a.type,i:'image',t:a.model,run:()=>{UI.libQ=(a.title||'').slice(0,30);go('library')}}));
  if(!q)return it.filter(x=>x.g==='Pages'||x.g==='Actions');
  const words=q.split(/\s+/);return it.filter(x=>{const h=(x.l+' '+(x.s||'')+' '+(x.t||'')+' '+x.g).toLowerCase();return words.every(w=>h.includes(w))}).slice(0,50)}
function palRender(){const q=$('#pal-q')?.value||'';palList=palItems(q);palSel=Math.min(palSel,Math.max(0,palList.length-1));let g='',h='';
  palList.forEach((x,i)=>{if(x.g!==g){g=x.g;h+=`<div class="pgrp">${g}</div>`}h+=`<div class="pit ${i===palSel?'on':''}" data-a="palRun" data-i="${i}">${ic(x.i)}<span class="ellip">${esc(x.l)}</span>${x.s?`<span class="s">${esc(x.s)}</span>`:''}</div>`});
  $('#pal-res').innerHTML=h||`<div class="empty sm">No results for “${esc(q)}”</div>`;$('.pit.on')?.scrollIntoView({block:'nearest'})}

/* ---------- data import/export ---------- */
const backupJSON=()=>JSON.stringify({app:'Gen Artz',version:1,exportedAt:new Date().toISOString(),data:S},null,2);
function exportData(){openModal('Export backup',`<div class="muted sm">Save a copy of all your ideas, hooks, posts, queue and settings. Your API key is never included.</div><div class="note">${ic('info')}<div>If the download doesn’t start (some previews block downloads), use <b>Copy backup</b> and paste it into a .json file. You can also paste it into Import on another device.</div></div>`,
  `<button class="btn" data-a="copyBackup">${ic('copy')}Copy backup</button><button class="btn pri" data-a="downloadBackup">${ic('download')}Download .json</button>`)}
function downloadBackup(){const blob=new Blob([backupJSON()],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`genartz-backup-${today()}.json`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000);toast('Backup downloaded')}
function importText(txt){try{const j=JSON.parse(txt);const d=j.data||j;if(!Array.isArray(d.ideas))throw new Error('bad');
  confirmBox('Replace your data?',`This backup has ${d.ideas.length} ideas, ${(d.hooks||[]).length} hooks and ${(d.posts||[]).length} posts. It will replace what’s on this device.`,'Replace',()=>{S=Object.assign(defaults(),d);S.settings=Object.assign(defaults().settings,d.settings||{});S.settings.endpoints=Object.assign({...DEFAULT_ENDPOINTS},S.settings.endpoints||{});save();applyTheme();render();toast('Backup imported')})}catch(e){toast('That isn’t a Gen Artz backup','bad')}}
function importFile(file){if(!file)return;const r=new FileReader();r.onload=()=>importText(r.result);r.readAsText(file)}

/* ---------- events ---------- */
document.addEventListener('click',async e=>{
  const el=e.target.closest('[data-a]');if(!el)return;const a=el.dataset.a,id=el.dataset.id;
  if((a==='ovClose'||a==='palClose')&&e.target!==el)return;
  if(el.tagName==='A'&&el.getAttribute('href'))return;
  switch(a){
   case 'go':go(el.dataset.r);break;
   case 'goSettings':closeModal();go('settings');break;
   case 'quick':{const q=el.dataset.q;if(q.startsWith('go:'))go(q.slice(3));else if(q==='newIdea')ideaModal();else if(q==='newPost')postModal();else if(q==='generate')generate();else if(q==='addAsset')assetModal();else if(q==='export')exportData();else if(q==='focusHook'){$('#hk-text')?.focus()}break}
   case 'theme':toggleTheme();break;
   case 'pal':openPal();break;
   case 'palClose':closePal();break;

   case 'ovClose':case 'closeModal':closeModal();break;

   // ideas

   case 'editIdea':ideaModal(id);break;
   case 'saveIdea':saveIdea(id||null);break;
   case 'delIdea':confirmBox('Delete idea?','Its hooks and posts stay, but they’ll be unlinked.','Delete',()=>{S.ideas=S.ideas.filter(x=>x.id!==id);S.hooks.forEach(h=>{if(h.ideaId===id)h.ideaId=''});S.posts.forEach(p=>{if(p.ideaId===id)p.ideaId=''});save();render();toast('Idea deleted')});break;
   case 'ideaView':UI.ideaView=el.dataset.v;render();break;
   case 'ideaHook':{const r=saveIdea(id,true);if(!r)break;closeModal();UI.hookIdea=id;UI.hookTopic=r.title;UI.hookSugs=genHooks(r.title);go('hooks');break}
   case 'ideaSchedule':{let r=S.ideas.find(x=>x.id===id);if($('#m-title')){r=saveIdea(id,true);if(!r)break}closeModal();postModal(null,{ideaId:id,title:r.title,platform:r.platform});break}
   case 'ideaGen':{const r=saveIdea(id,true);if(!r)break;closeModal();UI.cat=['image','video'].includes(UI.cat)?UI.cat:'video';const m=curModel().cat===UI.cat?curModel():MODELS.find(x=>x.cat===UI.cat);UI.model=m.id;formOf(m).prompt=r.title+(r.notes?'. '+r.notes:'');formOf(m).__idea=id;go('studio');break}
   // hooks

   case 'hookSaveSug':{const t=UI.hookSugs[+el.dataset.i];S.hooks.unshift({id:uid(),text:t,ideaId:UI.hookIdea,rating:0,createdAt:Date.now()});UI.hookSugs.splice(+el.dataset.i,1);act('hook');save();render();toast('Hook saved');break}
   case 'hookSave':{const t=UI.hookDraft.trim();if(!t){toast('Write a hook first');break}S.hooks.unshift({id:uid(),text:t,ideaId:UI.hookIdea,rating:0,createdAt:Date.now()});UI.hookDraft='';act('hook');save();render();toast('Hook saved');break}
   case 'hookSort':UI.hookSort=el.dataset.v;render();break;
   case 'rate':{const h=S.hooks.find(x=>x.id===id);h.rating=h.rating===+el.dataset.v?0:+el.dataset.v;save();render();break}
   case 'copyHook':copy(S.hooks.find(x=>x.id===id).text,'Hook copied');break;
   case 'delHook':S.hooks=S.hooks.filter(x=>x.id!==id);save();render();toast('Hook deleted');break;
   case 'hookStudio':{const h=S.hooks.find(x=>x.id===id);UI.cat='video';const m=curModel().cat==='video'?curModel():MODELS.find(x=>x.cat==='video');UI.model=m.id;UI.pendingPrompt=h.text;UI.pendingIdea=h.ideaId||'';go('studio');break}
   // calendar & posts
   case 'calNav':{const v=+el.dataset.v;if(!v){UI.cal={y:new Date().getFullYear(),m:new Date().getMonth()}}else{const d=new Date(UI.cal.y,UI.cal.m+v,1);UI.cal={y:d.getFullYear(),m:d.getMonth()}}render();break}
   case 'dayClick':postModal(null,{date:el.dataset.day});break;
   case 'newPost':postModal();break;
   case 'editPost':postModal(id);break;
   case 'savePost':savePost(id||null);break;

   case 'insertHook':pickFromModal('hook');break;
   case 'insertIdea':pickFromModal('idea');break;
   case 'insText':closeModal();setPrompt(el.dataset.v,'.');break;
   case 'insIdea':{const i=S.ideas.find(x=>x.id===id);closeModal();formOf(curModel()).__idea=id;setPrompt(i.title+(i.notes?'. '+i.notes:''),'.');break}
   case 'addTerm':setPrompt(el.dataset.v,',');break;
   case 'insertTpl':insertTpl();break;
   case 'insertMulti':insertMulti();break;
   case 'undoTpl':{const m=curModel();if(UI._undo&&UI._undo.id===m.id){formOf(m).prompt=UI._undo.p;UI._undo=null;render()}break}
   case 'insertTag':{const t=$('#sf-prompt');const v=el.dataset.v;if(t){const a0=t.selectionStart??t.value.length,b0=t.selectionEnd??a0;t.value=t.value.slice(0,a0)+v+t.value.slice(b0);t.focus();t.setSelectionRange(a0+v.length,a0+v.length);sfInput(t)}break}
   case 'loadJob':{const j=S.jobs.find(x=>x.id===id);const m=MODELS.find(x=>x.id===j.model);if(!m)break;UI.cat=m.cat;UI.model=m.id;UI.forms[m.id]={...formOf(m),...(j.form||{prompt:j.prompt})};render();$('#view').scrollTop=0;toast('Loaded into the form');break}
   case 'cancelJob':{const j=S.jobs.find(x=>x.id===id);try{await api.cancel(j);j.status='canceled'}catch(err){toast(err.message,'bad')}save();refreshJobs();break}
   case 'copyJob':{const j=S.jobs.find(x=>x.id===id);copy(j.prompt||JSON.stringify(j.body),'Prompt copied');break}
   case 'delJob':S.jobs=S.jobs.filter(x=>x.id!==id);save();refreshJobs();break;
   case 'clearJobs':S.jobs=S.jobs.filter(j=>!TERMINAL.includes(j.status)||j.status==='draft');save();render();break;
   // library
   case 'libF':UI.libF=el.dataset.v;render();break;
   case 'addAsset':assetModal();break;
   case 'editAsset':assetModal(id);break;
   case 'saveAsset':{const t=$('#a-title').value.trim(),ty=$('#a-type').value,ide=$('#a-idea').value;if(id){Object.assign(S.assets.find(x=>x.id===id),{title:t,type:ty,ideaId:ide})}else{const u=$('#a-url').value.trim();if(!/^https?:\/\//.test(u)){toast('Paste a full https:// link');break}S.assets.unshift({id:uid(),url:u,type:ty||mediaType(u,''),title:t,ideaId:ide,model:'Added manually',createdAt:Date.now()});act('gen')}save();closeModal();render();toast('Saved to library');break}
   case 'copyUrl':copy(S.assets.find(x=>x.id===id).url,'Link copied');break;
   case 'delAsset':S.assets=S.assets.filter(x=>x.id!==id);save();render();break;
   // settings
   case 'setTheme':S.settings.theme=el.dataset.v;save();applyTheme();render();break;
   case 'saveKey':{const kid=$('#k-id').value.trim(),ks=$('#k-sec').value.trim();if(!kid||!ks){toast('Enter both the key ID and the secret');break}const r=await window.genartz.setKey({id:kid,secret:ks});UI.hasKey=!!(r&&r.ok);render();toast(UI.hasKey?'API key saved and encrypted on this PC':'Couldn’t save the key: '+(r&&r.error),UI.hasKey?'':'bad');break}
   case 'removeKey':await window.genartz.setKey({id:'',secret:''});UI.hasKey=false;render();toast('API key removed');break;
   case 'testKey':{toast('Testing…');const r=await window.genartz.test();toast(r.ok?'Connected to Higgsfield ✓':r.error,r.ok?'':'bad');break}
   case 'delEp':delete S.settings.endpoints[id];save();render();break;
   case 'askNotif':Notification.requestPermission().then(()=>render());break;
   case 'export':exportData();break;
   case 'copyBackup':copy(backupJSON(),'Backup copied. Paste it into a .json file to keep it.');break;
   case 'downloadBackup':downloadBackup();closeModal();break;
   case 'pasteBackup':openModal('Paste a backup','<div class="fld"><label for="pb-txt">Backup JSON</label><textarea id="pb-txt" rows="8" placeholder=\'{"app":"Gen Artz", …}\' style="font-family:ui-monospace,Consolas,monospace;font-size:12px"></textarea></div>',`<button class="btn" data-a="closeModal">Cancel</button><button class="btn pri" data-a="pasteImport">${ic('upload')}Import</button>`);break;
   case 'pasteImport':{const t=$('#pb-txt').value;closeModal();importText(t);break}
   case 'clearSample':['ideas','hooks','posts'].forEach(k=>S[k]=S[k].filter(x=>!x.sample));save();render();toast('Sample data removed');break;
   case 'reset':confirmBox('Erase everything?','This deletes all ideas, hooks, posts, generations and settings on this device. Export a backup first if you want to keep them.','Erase',()=>{S=defaults();save();applyTheme();render();toast('All data erased')});break;
  }
});
document.addEventListener('input',e=>{const t=e.target;
  if(t.dataset.f&&t.tagName!=='SELECT'){UI[t.dataset.f]=t.value;render()}
  if(t.dataset.live){UI[t.dataset.live]=t.value;live(t.dataset.live)}
  if(t.dataset.sf!==undefined&&t.tagName!=='SELECT'&&t.type!=='checkbox')sfInput(t);
  if(t.dataset.ep!==undefined){S.settings.endpoints[UI.model]=cleanPath(t.value);saveSoon();updatePreview()}
  if(t.id==='pal-q'){palSel=0;palRender()}
  if(t.dataset.set&&t.type!=='checkbox'&&t.type!=='number'){S.settings[t.dataset.set]=t.value.trim();saveSoon();renderSide()}
});
document.addEventListener('change',e=>{const t=e.target;
  if(t.dataset.f&&t.tagName==='SELECT'){UI[t.dataset.f]=t.value;render()}
  if(t.dataset.sf!==undefined&&(t.tagName==='SELECT'||t.type==='checkbox'))sfInput(t);
  if(t.dataset.set&&(t.type==='checkbox'||t.type==='number')){S.settings[t.dataset.set]=t.type==='checkbox'?t.checked:Math.max(1,Math.min(50,+t.value||5));save();render()}
  if(t.id==='m-idea'){const i=S.ideas.find(x=>x.id===t.value);if(i){const ti=$('#m-ptitle');if(ti&&!ti.value.trim())ti.value=i.title;$('#m-pplat').value=i.platform;const hs=S.hooks.filter(h=>h.ideaId===i.id);$('#m-hook').innerHTML='<option value="">No hook</option>'+hs.map(h=>`<option value="${h.id}">${esc(h.text.slice(0,70))}</option>`).join('')}}
  if(t.id==='imp-file'){importFile(t.files[0]);t.value=''}
});
document.addEventListener('keydown',e=>{
  const typing=/INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName);
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();$('#palette').innerHTML?closePal():openPal();return}
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='n'&&!$('#modal').innerHTML){e.preventDefault();ideaModal();return}
  if(e.key==='/'&&!typing&&!$('#modal').innerHTML){e.preventDefault();openPal();return}
  if(e.key==='Escape'){if($('#palette').innerHTML)closePal();else if($('#modal').innerHTML)closeModal();return}
  if($('#palette').innerHTML){if(e.key==='ArrowDown'){e.preventDefault();palSel=Math.min(palList.length-1,palSel+1);palRender()}else if(e.key==='ArrowUp'){e.preventDefault();palSel=Math.max(0,palSel-1);palRender()}else if(e.key==='Enter'){e.preventDefault();const x=palList[palSel];closePal();x&&x.run()}return}
  if(e.key==='Enter'&&(e.ctrlKey||e.metaKey)){if(UI.route==='studio'&&!$('#modal').innerHTML){e.preventDefault();generate()}else if($('[data-a="saveIdea"]'))$('[data-a="saveIdea"]').click();else if($('[data-a="savePost"]'))$('[data-a="savePost"]').click()}
  if(e.key==='Tab'&&!e.shiftKey&&e.target.id==='sf-prompt'&&e.target.value.includes('«')){const t=e.target,v=t.value;let i=v.indexOf('«',t.selectionEnd);if(i<0)i=v.indexOf('«');if(i>=0){e.preventDefault();t.setSelectionRange(i,v.indexOf('»',i)+1)}}
  if(e.key==='Enter'&&e.target.id==='hb-topic'){e.preventDefault();$('[data-a="hookGen"]').click()}
});
document.addEventListener('dragstart',e=>{const el=e.target.closest?.('[data-drag]');if(!el)return;e.dataTransfer.setData('text/plain',el.dataset.drag+':'+el.dataset.id);e.dataTransfer.effectAllowed='move'});
document.addEventListener('dragover',e=>{const t=e.target.closest?.('[data-drop]');if(!t)return;e.preventDefault();$$('.over').forEach(x=>x!==t&&x.classList.remove('over'));t.classList.add('over')});
document.addEventListener('dragleave',e=>{const t=e.target.closest?.('[data-drop]');if(t&&!t.contains(e.relatedTarget))t.classList.remove('over')});
document.addEventListener('dragend',()=>$$('.over').forEach(x=>x.classList.remove('over')));
document.addEventListener('drop',e=>{const t=e.target.closest?.('[data-drop]');if(!t)return;e.preventDefault();t.classList.remove('over');const[kind,id]=(e.dataTransfer.getData('text/plain')||'').split(':');
  if(kind==='post'&&t.dataset.drop==='day'){const p=S.posts.find(x=>x.id===id);if(p&&p.date!==t.dataset.day){p.date=t.dataset.day;p.notified=false;save();render();toast('Moved to '+fmtDate(p.date))}}
  if(kind==='idea'&&t.dataset.drop==='status'){const i=S.ideas.find(x=>x.id===id);if(i&&i.status!==t.dataset.status){i.status=t.dataset.status;i.updatedAt=Date.now();act(i.status==='Posted'?'post':'idea');save();render()}}});

/* ---------- reminders ---------- */
function checkDue(){if(!S.settings.remind)return;const n=Date.now();let ch=false;
  S.posts.forEach(p=>{if(p.status==='posted'||p.notified)return;const[h,mi]=(p.time||'09:00').split(':').map(Number);const d=parseYmd(p.date);d.setHours(h,mi);const diff=n-d.getTime();if(diff>=0&&diff<36e5){notify('Time to post: '+p.title,plat(p.platform).n+' · '+fmtTime(p.time));toast('⏰ Time to post: '+p.title);p.notified=true;ch=true}});if(ch)save()}
setInterval(checkDue,30000);

/* ---------- boot ---------- */
load();applyTheme();
UI.route=routeFromHash();
render();setTimeout(checkDue,1500);
if(DESK&&window.genartz.hasKey)window.genartz.hasKey().then(v=>{UI.hasKey=!!v;render();pollJobs()});else pollJobs();
</script>
</body>
</html>
